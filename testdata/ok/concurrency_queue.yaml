on:
  workflow_dispatch:
    inputs:
      queue:

concurrency:
  group: deploy-queue
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: job-queue
      cancel-in-progress: false
      queue: max
    steps:
      - run: echo "deploy"
  test2:
    runs-on: ubuntu-latest
    concurrency:
      group: job-single
      queue: single
    steps:
      - run: echo "single"
  test3:
    # A ${{ }} value is not checked against the literal pair, so neither is the
    # combination rule: GitHub cannot know the value before the expression runs.
    runs-on: ubuntu-latest
    concurrency:
      group: job-expr
      cancel-in-progress: true
      queue: ${{ fromJSON(inputs.queue) }}
    steps:
      - run: echo "expression"
