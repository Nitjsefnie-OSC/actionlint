on: push

concurrency:
  group: test
  queue: invalid

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: job-test
      cancel-in-progress: true
      queue: max
    steps:
      - run: echo

  test2:
    # A wrong value is reported even when cancel-in-progress is absent, and
    # the job-level section gets the same two rules as the workflow-level one.
    runs-on: ubuntu-latest
    concurrency:
      group: job-bad
      queue: Max
    steps:
      - run: echo
